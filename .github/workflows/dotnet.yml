name: .NET

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PriceCheck.Tests/PriceCheck.Tests.csproj
      - run: dotnet build PriceCheck.App/PriceCheck.csproj --no-restore --configuration Release
      - run: dotnet test PriceCheck.Tests/PriceCheck.Tests.csproj --configuration Release